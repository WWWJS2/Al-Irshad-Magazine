<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <title>مجلة الابتدائية الثانية برأس تنورة — نسخة إلكترونية تفاعلية</title>
  <meta name="color-scheme" content="light">
  <style>
    :root{
      --bar1:#f5699d;--bar2:#6dcff6;--ink:#26436d;--soft:#eff8ff;--line:#dbe8f3;
      --pink:#f5699d;--mint:#45c697;--yellow:#ffc83d;--paper:#ffffff;--teal:#28b7b1;--vio:#7f6cff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#e8f7ff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}
    input,textarea,button,select{font-family:inherit}
    #topbar{position:fixed;top:0;right:0;left:0;height:54px;display:flex;align-items:center;justify-content:center;padding:0 14px;background:linear-gradient(90deg,var(--bar1),var(--bar2));color:#fff;z-index:20;box-shadow:0 2px 10px rgba(36,68,111,.14);font-weight:800;font-size:16px;text-align:center}
    #stage{position:fixed;top:54px;bottom:64px;right:0;left:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;touch-action:pan-x pan-y pinch-zoom;background:radial-gradient(circle at 50% 25%,#fff 0%,#e8f7ff 60%,#dcf3fd 100%)}
    #spread{display:flex;gap:18px;align-items:flex-start;justify-content:center}
    .pageWrap{width:min(93vw,520px);flex:0 0 auto}
    .pageWrap.desktop{width:min(43vw,520px)}
    .pageFrame{position:relative;background:#fff;border-radius:18px;box-shadow:0 10px 28px rgba(36,68,111,.16);overflow:hidden;container-type:inline-size}
    .pageFrame img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
    .overlay{position:absolute;inset:0;pointer-events:none}

    .ov-chip,.ov-clear,.ov-open,.ov-smallbtn,.starbtn,.choiceBtn{
      position:absolute;pointer-events:auto;border:0;border-radius:999px;cursor:pointer;font-weight:800;
      display:flex;align-items:center;justify-content:center;line-height:1.2
    }
    .ov-open{background:rgba(255,255,255,.92);color:#35557f;border:1px solid rgba(105,135,170,.28);padding:.8cqw 2.4cqw;font-size:2.15cqw;box-shadow:0 .4cqw 1.6cqw rgba(36,68,111,.12)}
    .ov-chip{background:rgba(255,255,255,.9);color:#35557f;border:1px solid rgba(105,135,170,.22);padding:.6cqw 1.5cqw;font-size:1.9cqw;box-shadow:0 .4cqw 1.3cqw rgba(36,68,111,.10)}
    .ov-clear{background:rgba(255,255,255,.88);color:#7c8da8;border:1px solid rgba(105,135,170,.18);width:6cqw;height:6cqw;font-size:2.2cqw;box-shadow:0 .3cqw 1cqw rgba(36,68,111,.10)}
    .ov-smallbtn{background:rgba(255,255,255,.96);color:#35557f;border:1px solid rgba(105,135,170,.22);padding:.8cqw 2cqw;font-size:2.1cqw;box-shadow:0 .4cqw 1.5cqw rgba(36,68,111,.14)}
    .starbtn{background:transparent;color:#d5d9df;font-size:4.2cqw;width:5.3cqw;height:5.3cqw;text-shadow:0 .08cqw .12cqw rgba(0,0,0,.1)}
    .starbtn.on{color:#f4c543}
    .choiceBtn{background:rgba(255,255,255,.85);border:.45cqw solid currentColor;width:3.6cqw;height:3.6cqw;font-size:0;color:#cfd8e3}
    .choiceBtn.fact{color:#3aa46b}.choiceBtn.fact.on{background:#3aa46b}
    .choiceBtn.fiction{color:#db6363}.choiceBtn.fiction.on{background:#db6363}

    .lineInput,.nameInput,.miniInput,.wideInput,.bottomInput,.overlayTextarea{
      position:absolute;pointer-events:auto;border:0;background:rgba(255,255,255,.28);color:#29486f;
      outline:none;text-align:center;border-bottom:.35cqw dashed rgba(100,120,150,.55);padding:.3cqw .8cqw;font-weight:700
    }
    .lineInput::placeholder,.nameInput::placeholder,.miniInput::placeholder,.wideInput::placeholder,.bottomInput::placeholder,.overlayTextarea::placeholder{color:#95a9be}
    .lineInput:focus,.nameInput:focus,.miniInput:focus,.wideInput:focus,.bottomInput:focus,.overlayTextarea:focus{background:rgba(255,255,255,.75);box-shadow:0 0 0 .4cqw rgba(108,207,246,.15);border-radius:1.2cqw}
    .lineInput,.miniInput{font-size:2.15cqw}
    .nameInput{font-size:2.5cqw}
    .wideInput,.bottomInput{font-size:2.35cqw}
    .overlayTextarea{font-size:2.3cqw;resize:none;border:.28cqw dashed rgba(100,120,150,.35);border-radius:2cqw;background:rgba(255,255,255,.35);padding:1.1cqw;text-align:right}

    .sumLabel{position:absolute;pointer-events:none;font-size:2.8cqw;font-weight:900;color:#7b6724;text-align:center}
    .hintTag{position:absolute;pointer-events:none;font-size:1.75cqw;font-weight:800;color:#7d95b4;background:rgba(255,255,255,.75);padding:.4cqw 1cqw;border-radius:999px}
    .patchBox{position:absolute;pointer-events:none;background:rgba(255,255,255,.98);border-radius:1.7cqw;display:flex;align-items:center;justify-content:center;color:#3d4e6a;font-size:2.45cqw;font-weight:700}

    .modalCard{position:absolute;pointer-events:auto;inset:10% 8%;background:rgba(255,255,255,.97);border:1px solid rgba(130,160,195,.28);border-radius:4cqw;box-shadow:0 1.2cqw 3.2cqw rgba(36,68,111,.20);padding:3.6cqw 3.2cqw 3cqw;overflow:auto;backdrop-filter:blur(2px)}
    .modalTitle{font-size:3.2cqw;font-weight:900;color:#24446f;margin:0 0 1.8cqw;display:flex;align-items:center;gap:1cqw}
    .modalHelp{font-size:2.05cqw;line-height:1.8;color:#617d9f;margin:0 0 2.4cqw}
    .modalClose{position:absolute;left:2.2cqw;top:2.2cqw;pointer-events:auto;border:0;background:#eef6fc;color:#47658f;border-radius:999px;width:6.2cqw;height:6.2cqw;font-size:2.5cqw;cursor:pointer;font-weight:900}
    .modalGrid{display:grid;grid-template-columns:1fr 1fr;gap:1.5cqw}
    .modalField label{display:block;font-size:1.95cqw;font-weight:800;color:#45658f;margin-bottom:.7cqw}
    .modalField input,.modalField textarea,.modalField select{width:100%;border:1px solid #cfe1ef;border-radius:1.7cqw;padding:1.2cqw 1.5cqw;background:#fbfeff;color:#24446f;font:inherit;font-size:2cqw;outline:none}
    .modalField textarea{min-height:12cqw;resize:vertical}
    .modalField input:focus,.modalField textarea:focus,.modalField select:focus{border-color:#7bcdf0;box-shadow:0 0 0 .45cqw rgba(108,207,246,.14)}
    .modalActions{display:flex;flex-wrap:wrap;gap:1cqw;margin-top:2cqw}
    .modalActions button{border:0;background:#eef6fc;color:#35557f;border-radius:999px;padding:1cqw 1.8cqw;font-size:1.95cqw;font-weight:800;cursor:pointer}
    .modalActions button.primary{background:#f5699d;color:#fff}
    .resultMsg{margin-top:1.6cqw;font-size:2cqw;font-weight:800;color:#35557f}
    .daysHead{display:grid;grid-template-columns:repeat(5,1fr);gap:.8cqw;margin-bottom:1cqw}
    .daysHead span{text-align:center;font-size:1.8cqw;font-weight:800;color:#6d88aa}
    .checkTable{display:grid;gap:1cqw}
    .checkRow{display:grid;grid-template-columns:1fr repeat(5,4.8cqw);gap:.8cqw;align-items:center;border:1px solid #e6f1f9;border-radius:1.7cqw;padding:1cqw;background:#fbfdff}
    .checkRow .lbl{font-size:1.9cqw;font-weight:800;color:#35557f}
    .tableBtn{width:4.3cqw;height:4.3cqw;border-radius:1.2cqw;border:2px solid #8ed7b9;background:#fff;cursor:pointer}
    .tableBtn.on{background:#45c697;border-color:#45c697;position:relative}
    .tableBtn.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2cqw;font-weight:900}
    .sumPanel{margin-top:1.2cqw;border:2px dashed #f3d279;background:#fffdf3;border-radius:1.8cqw;padding:1.2cqw 1.5cqw;font-weight:900;color:#7b6724;text-align:center;font-size:2.2cqw}

    .tfRow{display:grid;grid-template-columns:1fr auto auto;gap:1cqw;align-items:center;border:1px solid #e6f1f9;border-radius:1.7cqw;padding:1cqw;background:#fbfdff}
    .tfRow .txt{font-size:1.95cqw;font-weight:800;color:#35557f;line-height:1.7}

    #toolbar{position:fixed;bottom:0;right:0;left:0;height:64px;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;z-index:20;box-shadow:0 -2px 10px rgba(36,68,111,.10);padding:8px;border-top:1px solid #eef5fb}
    #toolbar button{border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 1px 0 rgba(36,68,111,.08)}
    #toolbar button.nav{background:#f5699d;color:#fff;border:1px solid rgba(255,255,255,.75)}
    #pgind{min-width:104px;text-align:center;font-size:12px;font-weight:800;color:#52709a}

    @media (max-width: 900px){
      #topbar{font-size:14px;height:48px}
      #stage{top:48px;bottom:64px;padding:10px}
      #spread{gap:0}
      .pageWrap,.pageWrap.desktop{width:min(96vw,620px)}
      #toolbar{gap:5px;padding:8px 6px}
      #toolbar button{font-size:11px;padding:8px 10px}
      #toolbar button.nav{padding:8px 14px}
      #pgind{min-width:82px;font-size:11px}
    }
    @media print{
      #topbar,#toolbar{display:none !important}
      html,body{overflow:visible;height:auto;background:#fff}
      #stage{position:static;overflow:visible;display:block;padding:0;background:#fff}
      #spread{display:block}
      .pageWrap,.pageWrap.desktop{width:210mm !important}
      .pageFrame{box-shadow:none;border-radius:0;page-break-after:always;break-after:page;margin:0 auto}
    }
  </style>
</head>
<body>
  <div id="topbar">مجلة الابتدائية الثانية برأس تنورة — نسخة إلكترونية تفاعلية</div>
  <div id="stage"><div id="spread"></div></div>
  <div id="toolbar">
    <button id="homeBtn">الرئيسية</button>
    <button id="prevBtn" class="nav">السابق</button>
    <span id="pgind">1 / 28</span>
    <button id="nextBtn" class="nav">التالي</button>
    <button id="topBtn">أعلى الصفحة</button>
  </div>
<script>
const pages = Array.from({length:28}, (_,i)=>({src:`page_${String(i+1).padStart(2,'0')}.jpg`,alt:`صفحة ${i+1}`}));
let index=0;
const spread=document.getElementById('spread');
const stage=document.getElementById('stage');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const homeBtn=document.getElementById('homeBtn');
const topBtn=document.getElementById('topBtn');
const pgind=document.getElementById('pgind');
const STORE='magazine_inline_interactive_v3';
let state={}; try{ state=JSON.parse(localStorage.getItem(STORE)||'{}'); }catch(e){ state={}; }
const ui={};
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }
function sv(k,v){ state[k]=v; save(); }
function gv(k,d=''){ return Object.prototype.hasOwnProperty.call(state,k)? state[k]:d; }
function esc(s){ return String(s ?? '').replace(/[&<>\"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function isMobile(){ return window.innerWidth <= 900; }
function norm(s){ return String(s||'').trim().replace(/\s+/g,' ').replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ـ]/g,'').toLowerCase(); }
function getShownPages(){
  if(isMobile()) return [index+1];
  if(index===0) return [1];
  const p1=index+1; const p2=p1+1<=pages.length ? p1+1 : null;
  return p2 ? [p1,p2] : [p1];
}
function clearPrefix(prefix){ Object.keys(state).filter(k=>k.startsWith(prefix)).forEach(k=>delete state[k]); save(); }
function toggleBool(key){ sv(key, !gv(key,false)); }
function setChoice(key,val){ sv(key,val); }
function setStars(key,val){ sv(key, Number(val)); }
function openModal(id){ ui[id]=true; render(false); }
function closeModal(id){ ui[id]=false; render(false); }

function modalField(key,label,ph=''){ return `<div class="modalField"><label>${label}</label><input type="text" data-text="${key}" value="${esc(gv(key,''))}" placeholder="${ph}"></div>`; }
function modalArea(key,label,ph=''){ return `<div class="modalField" style="grid-column:1 / -1"><label>${label}</label><textarea data-text="${key}" placeholder="${ph}">${esc(gv(key,''))}</textarea></div>`; }
function modalCheckRow(base,row,label,points){
  let cells='';
  for(let d=0; d<5; d++){
    const key=`${base}${row}_${d}`;
    cells += `<button type="button" class="tableBtn ${gv(key,false)?'on':''}" data-toggle="${key}" aria-label="${label} ${d+1}"></button>`;
  }
  return `<div class="checkRow"><div class="lbl">${label} <span style="font-size:1.6cqw;color:#6d88aa">(${points} نقاط)</span></div>${cells}</div>`;
}
function checkTotal(){
  const items=[10,10,5,10,10,5];
  let total=0; for(let r=0;r<6;r++) for(let d=0;d<5;d++) if(gv(`p8_${r}_${d}`,false)) total+=items[r];
  return total;
}
function resultMsg(id){ return gv(id,'') ? `<div class="resultMsg">${esc(gv(id,''))}</div>` : ''; }

function pageOverlay(pageNo){
  switch(pageNo){
    case 3:
      return `
        <div class="patchBox" style="left:8.7%;top:52.1%;width:45.4%;height:4.2%;">أ. ريمية الشمري</div>
        <div class="hintTag" style="right:8%;bottom:8.5%;">تم تحسين المحاذاة ورفع الجودة</div>`;
    case 4: {
      const stars = Array.from({length:7}, (_,i)=>`<button type="button" class="starbtn ${Number(gv('p4_stars',0))>i?'on':''}" data-stars-group="p4_stars" data-stars-value="${i+1}" style="right:${18.5 + i*5.35}%;top:18.7%;">★</button>`).join('');
      return `${stars}<div class="sumLabel" style="left:7%;top:71.3%;width:86%;">أيام الإنجاز: ${gv('p4_stars',0)} من 7</div><button type="button" class="ov-clear" data-clear-prefix="p4_" style="left:6%;top:88%;">×</button>`;
    }
    case 8:
      return `<button type="button" class="ov-open" data-open-modal="p8" style="left:30%;top:73%;width:40%;height:6.2%;">افتحي الجدول التفاعلي</button>${ui['p8']?pageModal(8):''}`;
    case 9:
      return `<button type="button" class="ov-open" data-open-modal="p9" style="left:30%;top:82.2%;width:40%;height:5.7%;">حلّي النشاط داخل الصفحة</button>${ui['p9']?pageModal(9):''}`;
    case 10:
      return `<button type="button" class="ov-open" data-open-modal="p10" style="left:30%;top:72.2%;width:40%;height:5.6%;">حلّي الألغاز والأمثال</button>${ui['p10']?pageModal(10):''}`;
    case 12:
      return `<button type="button" class="ov-open" data-open-modal="p12" style="left:32%;top:55.2%;width:36%;height:5.6%;">ابدئي الحل</button>${ui['p12']?pageModal(12):''}`;
    case 13:
      return `<button type="button" class="ov-open" data-open-modal="p13" style="left:31%;top:82%;width:38%;height:5.6%;">ابدئي التمرين</button>${ui['p13']?pageModal(13):''}`;
    case 15:
      return `<button type="button" class="ov-open" data-open-modal="p15" style="left:30%;top:72.3%;width:40%;height:5.8%;">حلّي الشبكة</button>${ui['p15']?pageModal(15):''}`;
    case 18:
      return `<input class="bottomInput" type="text" data-text="p18_answer" value="${esc(gv('p18_answer',''))}" placeholder="اكتبي الإجابة هنا" style="left:24%;top:59.8%;width:40%;height:3.8%;"><button type="button" class="ov-clear" data-clear-prefix="p18_" style="left:6.5%;top:62.4%;">×</button>`;
    case 19: {
      let html='';
      const tops=[22.3,30.0,37.5,45.2,52.9,60.6,68.3];
      tops.forEach((t,idx)=>{
        const key=`p19_${idx+1}`;
        html += `<button type="button" class="choiceBtn fiction ${gv(key,'')==='fiction'?'on':''}" data-choice-group="${key}" data-choice="fiction" style="left:17.8%;top:${t}%;"></button>`;
        html += `<button type="button" class="choiceBtn fact ${gv(key,'')==='fact'?'on':''}" data-choice-group="${key}" data-choice="fact" style="left:31.6%;top:${t}%;"></button>`;
      });
      html += `<button type="button" class="ov-smallbtn" data-check="p19" style="left:30%;top:76.4%;width:18%;height:4.8%;">تحقق</button>`;
      html += `<button type="button" class="ov-clear" data-clear-prefix="p19_" style="left:6%;top:76.1%;">×</button>`;
      if(gv('res-p19','')) html += `<div class="hintTag" style="left:17%;top:76.6%;font-size:1.95cqw;">${esc(gv('res-p19',''))}</div>`;
      return html;
    }
    case 21:
      return `
        <button type="button" class="ov-open" data-open-modal="p21" style="left:32%;top:60.7%;width:36%;height:5.5%;">صِلي الكلمات</button>
        <input class="nameInput" type="text" data-text="p21_name" value="${esc(gv('p21_name',''))}" placeholder="Your name" style="left:30%;top:70.8%;width:40%;height:4%;">
        <button type="button" class="ov-clear" data-clear-prefix="p21_" style="left:6%;top:72.3%;">×</button>
        ${ui['p21']?pageModal(21):''}`;
    case 22:
      return `<textarea class="overlayTextarea" data-text="p22_uses" placeholder="مثال: البحث، حل الواجبات، مشاهدة شرح تعليمي" style="left:14%;top:72%;width:72%;height:11.8%;">${esc(gv('p22_uses',''))}</textarea><button type="button" class="ov-clear" data-clear-prefix="p22_" style="left:6%;top:76.6%;">×</button>`;
    case 23:
      return `<textarea class="overlayTextarea" data-text="p23_goal" placeholder="مثال: أقرأ 10 دقائق يوميًا" style="left:14%;top:70.8%;width:72%;height:11.2%;">${esc(gv('p23_goal',''))}</textarea><button type="button" class="ov-clear" data-clear-prefix="p23_" style="left:6%;top:75.5%;">×</button>`;
    case 26:
      return `<textarea class="overlayTextarea" data-text="p26_msg" placeholder="اكتبي رسالة شكر صادقة من قلبك" style="left:11%;top:65.2%;width:78%;height:11.5%;">${esc(gv('p26_msg',''))}</textarea><button type="button" class="ov-clear" data-clear-prefix="p26_" style="left:6%;top:69.6%;">×</button>`;
    default: return '';
  }
}

function pageModal(pageNo){
  switch(pageNo){
    case 8:
      return `<div class="modalCard"><button type="button" class="modalClose" data-close-modal="p8">×</button><div class="modalTitle">دفتر أخلاقي وتصرفاتي</div><p class="modalHelp">كل النشاط أصبح داخل المجلة نفسها. علّمي الأيام وسيُحسب مجموع النقاط تلقائيًا.</p><div class="daysHead"><span>السبت</span><span>الأحد</span><span>الاثنين</span><span>الثلاثاء</span><span>الأربعاء</span></div><div class="checkTable">${modalCheckRow('p8_',0,'صدقة ولو بريال',10)}${modalCheckRow('p8_',1,'أساعد محتاجًا أو زميلة',10)}${modalCheckRow('p8_',2,'أقول كلمة طيبة',5)}${modalCheckRow('p8_',3,'أقرأ وردي من القرآن',10)}${modalCheckRow('p8_',4,'أبر والدي وأطيعهما',10)}${modalCheckRow('p8_',5,'أحافظ على نظافة صفي',5)}</div><div class="sumPanel">مجموع نقاطي هذا الأسبوع: ${checkTotal()}</div><div class="modalActions"><button type="button" data-clear-prefix="p8_">مسح الجدول</button></div></div>`;
    case 9:
      return `<div class="modalCard"><button type="button" class="modalClose" data-close-modal="p9">×</button><div class="modalTitle">سحر الحروف</div><p class="modalHelp">اكتبي الإجابات هنا وسيتم حفظها داخل النسخة الإلكترونية.</p><div class="modalGrid">${modalField('p9_x1','ثلاثة أفعال ماضية')}${modalField('p9_x2','فعلان أمر')}${modalField('p9_x3','ثلاثة أسماء')}${modalField('p9_x4','أسلوب نداء')}${modalField('p9_m1','معنى السراج')}${modalField('p9_m2','معنى القِربة')}${modalField('p9_m3','معنى التنور')}${modalArea('p9_op','ما أجمل وصية في الرسالة برأيك؟','اكتبي رأيك هنا')}</div><div class="modalActions"><button type="button" data-clear-prefix="p9_">مسح</button></div></div>`;
    case 10:
      return `<div class="modalCard"><button type="button" class="modalClose" data-close-modal="p10">×</button><div class="modalTitle">ألغاز وأمثال</div><p class="modalHelp">اكتبي حلول الألغاز الستة وأكملي الحكم الأربع.</p><div class="modalGrid">${modalField('p10_r1','حل اللغز 1')}${modalField('p10_r2','حل اللغز 2')}${modalField('p10_r3','حل اللغز 3')}${modalField('p10_r4','حل اللغز 4')}${modalField('p10_r5','حل اللغز 5')}${modalField('p10_r6','حل اللغز 6')}${modalField('p10_p1','إكمال الحكمة 1')}${modalField('p10_p2','إكمال الحكمة 2')}${modalField('p10_p3','إكمال الحكمة 3')}${modalField('p10_p4','إكمال الحكمة 4')}</div><div class="modalActions"><button type="button" class="primary" data-check="p10">تحقق</button><button type="button" data-clear-prefix="p10_">مسح</button></div>${resultMsg('res-p10')}</div>`;
    case 12:
      return `<div class="modalCard"><button type="button" class="modalClose" data-close-modal="p12">×</button><div class="modalTitle">لغة الأرقام</div><p class="modalHelp">حلي العمليات ثم اكتبي الاستنتاجات.</p><div class="modalGrid">${modalField('p12_a1','نتيجة ١٧ + ٢٥')}${modalField('p12_a2','نتيجة ٦ × ٩')}${modalField('p12_a3','نتيجة ١٠٠ − ٥٨')}${modalField('p12_a4','نتيجة ٦ × ٧')}${modalField('p12_repeat','الرقم المتكرر')}${modalField('p12_thief','من أخذ الصندوق؟')}</div><div class="modalGrid" style="margin-top:1.5cqw">${modalArea('p12_match','كيف تشكلين مربعًا بثلاثة أعواد؟')}${modalArea('p12_river','كيف تعبرين النهر بالجميع بأمان؟')}</div><div class="modalActions"><button type="button" data-clear-prefix="p12_">مسح</button></div></div>`;
    case 13: {
      let sudoku='';
      const prefilled={1:'2',2:'3',3:'4',4:'1',10:'1',12:'3'};
      for(let i=1;i<=16;i++){
        if(prefilled[i]) sudoku += `<input value="${prefilled[i]}" readonly style="text-align:center;padding:1cqw 0;font-size:2.5cqw;font-weight:900;background:#eef7ff;border-color:#bcd7ef">`;
        else sudoku += `<input type="number" min="1" max="4" data-text="p13_s${i}" value="${esc(gv(`p13_s${i}`,''))}" style="text-align:center;padding:1cqw 0;font-size:2.5cqw;font-weight:900">`;
      }
      return `<div class="modalCard"><button type="button" class="modalClose" data-close-modal="p13">×</button><div class="modalTitle">مهارات تفكير عليا</div><p class="modalHelp">املئي السودوكو وأكملي التمارين.</p><div class="modalField"><label>سودوكو ٤×٤</label><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw;max-width:34cqw">${sudoku}</div></div><div class="modalGrid" style="margin-top:1.5cqw">${modalField('p13_pat1','أكملي النمط 1')}${modalField('p13_pat2','أكملي النمط 2')}${modalField('p13_pat3','أكملي النمط 3')}${modalField('p13_logic','سارة تحب / ريم تحب / هند تحب')}${modalArea('p13_odd','الرقم المختلف ولماذا؟','اكتبي إجابتك')}</div><div class="modalActions"><button type="button" data-clear-prefix="p13_">مسح</button></div></div>`;
    }
    case 15:
      return `<div class="modalCard"><button type="button" class="modalClose" data-close-modal="p15">×</button><div class="modalTitle">ما هو البلد الغامض؟</div><p class="modalHelp">اكتبي إجابات التلميحات ثم اكتشفي البلد الغامض.</p><div class="modalGrid">${modalField('p15_h1','أفقي ١: عاصمة البلد')}${modalField('p15_h3','أفقي ٣: منتج من الحليب')}${modalField('p15_h4','أفقي ٤: القارة')}${modalField('p15_h5','أفقي ٥: بلد الرسم والمتاحف')}${modalField('p15_v1','رأسي ١: بناء مرتفع من الحديد')}${modalField('p15_v2','رأسي ٢: نهر يمر بوسط العاصمة')}${modalField('p15_v4','رأسي ٤: اسم البرج الشهير')}${modalField('p15_country','البلد الغامض هو')}</div><div class="modalActions"><button type="button" class="primary" data-check="p15">تحقق</button><button type="button" data-clear-prefix="p15_">مسح</button></div>${resultMsg('res-p15')}</div>`;
    case 21:
      return `<div class="modalCard"><button type="button" class="modalClose" data-close-modal="p21">×</button><div class="modalTitle">English Corner</div><p class="modalHelp">اكتبي المطابقة الصحيحة لكل كلمة.</p><div class="modalGrid">${modalField('p21_m1','Sun =')}${modalField('p21_m2','Flower =')}${modalField('p21_m3','Star =')}${modalField('p21_m4','Cat =')}</div><div class="modalActions"><button type="button" class="primary" data-check="p21">تحقق</button><button type="button" data-clear-prefix="p21_">مسح</button></div>${resultMsg('res-p21')}</div>`;
    default: return '';
  }
}

function pageHtml(pageNo){
  const p=pages[pageNo-1];
  const desktopClass=isMobile()?'':' desktop';
  return `<div class="pageWrap${desktopClass}"><div class="pageFrame"><img loading="lazy" decoding="async" alt="${p.alt}" src="${p.src}"><div class="overlay">${pageOverlay(pageNo)}</div></div></div>`;
}

function render(resetScroll=true){
  if(resetScroll){ stage.scrollTop=0; stage.scrollLeft=0; }
  const shown=getShownPages();
  spread.innerHTML=shown.map(pageHtml).join('');
  if(isMobile()){
    pgind.textContent=`${index+1} / ${pages.length}`;
    prevBtn.disabled=index<=0; nextBtn.disabled=index>=pages.length-1;
  } else {
    pgind.textContent=shown.length===1?`${shown[0]} / ${pages.length}`:`${shown[0]}–${shown[1]} / ${pages.length}`;
    prevBtn.disabled=index<=0; nextBtn.disabled=shown[shown.length-1] >= pages.length;
  }
  bind();
}
function goPrev(){
  if(isMobile()){ if(index>0) index--; }
  else { if(index===0) return; if(index===1) index=0; else index=Math.max(1,index-2); }
  render();
}
function goNext(){
  if(isMobile()){ if(index<pages.length-1) index++; }
  else { if(index===0) index=1; else index=Math.min(pages.length-1,index+2); }
  render();
}
function bind(){
  document.querySelectorAll('[data-text]').forEach(el=>{
    el.addEventListener('input', ()=>sv(el.getAttribute('data-text'), el.value));
  });
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{ toggleBool(el.getAttribute('data-toggle')); render(false); });
  });
  document.querySelectorAll('[data-choice-group]').forEach(el=>{
    el.addEventListener('click', ()=>{ setChoice(el.getAttribute('data-choice-group'), el.getAttribute('data-choice')); render(false); });
  });
  document.querySelectorAll('[data-stars-group]').forEach(el=>{
    el.addEventListener('click', ()=>{ setStars(el.getAttribute('data-stars-group'), el.getAttribute('data-stars-value')); render(false); });
  });
  document.querySelectorAll('[data-clear-prefix]').forEach(el=>{
    el.addEventListener('click', ()=>{ clearPrefix(el.getAttribute('data-clear-prefix')); render(false); });
  });
  document.querySelectorAll('[data-open-modal]').forEach(el=>{
    el.addEventListener('click', ()=>openModal(el.getAttribute('data-open-modal')));
  });
  document.querySelectorAll('[data-close-modal]').forEach(el=>{
    el.addEventListener('click', ()=>closeModal(el.getAttribute('data-close-modal')));
  });
  document.querySelectorAll('[data-check]').forEach(el=>{
    el.addEventListener('click', ()=>{ checkAnswers(el.getAttribute('data-check')); render(false); });
  });
}
function checkAnswers(type){
  if(type==='p10'){
    const goodR=['المشط','القلم','الحفرة','الساعة','بيت الشعر','العصفور'];
    const goodP=['وجد','الشدائد','ودل','الحجر'];
    let c=0; goodR.forEach((a,i)=>{ if(norm(gv(`p10_r${i+1}`))===norm(a)) c++; });
    goodP.forEach((a,i)=>{ if(norm(gv(`p10_p${i+1}`))===norm(a)) c++; });
    sv('res-p10', c===10 ? 'ممتاز! كل الإجابات صحيحة 🌟' : `أحسنتِ! لديك ${c} من 10 صحيحة.`);
  }
  if(type==='p15'){
    const checks=[['p15_h1','باريس'],['p15_h3','جبن'],['p15_h4','اوروبا'],['p15_h5','فرنسا'],['p15_v1','برج'],['p15_v2','سين'],['p15_v4','ايفل'],['p15_country','فرنسا']];
    let c=0; checks.forEach(([k,a])=>{ if(norm(gv(k))===norm(a)) c++; });
    sv('res-p15', c===checks.length ? 'رائع! البلد الغامض هو فرنسا 🇫🇷' : `لديك ${c} من ${checks.length} صحيحة. حاولي مرة أخرى.`);
  }
  if(type==='p19'){
    const ans={p19_1:'fact',p19_2:'fact',p19_3:'fact',p19_4:'fiction',p19_5:'fiction',p19_6:'fact',p19_7:'fact'};
    let c=0; Object.keys(ans).forEach(k=>{ if(gv(k,'')===ans[k]) c++; });
    sv('res-p19', c===7 ? 'ممتاز! إجاباتك كلها صحيحة 🌟' : `أحسنتِ! لديك ${c} من 7 صحيحة.`);
  }
  if(type==='p21'){
    const ans={p21_m1:'شمس',p21_m2:'زهرة',p21_m3:'نجمة',p21_m4:'قطة'};
    let c=0; Object.keys(ans).forEach(k=>{ if(norm(gv(k))===norm(ans[k])) c++; });
    sv('res-p21', c===4 ? 'رائع! المطابقات صحيحة.' : `لديك ${c} من 4 صحيحة.`);
  }
}
prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);
homeBtn.addEventListener('click', ()=>{ index=0; render(); });
topBtn.addEventListener('click', ()=> stage.scrollTo({top:0,left:0,behavior:'smooth'}));
window.addEventListener('resize', ()=>render(false));
window.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') goPrev(); if(e.key==='ArrowLeft') goNext(); if(e.key==='Escape'){ Object.keys(ui).forEach(k=>ui[k]=false); render(false);} });
render();
</script>
</body>
