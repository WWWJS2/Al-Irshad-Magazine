<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <title>مجلة الابتدائية الثانية برأس تنورة — نسخة إلكترونية تفاعلية</title>
  <meta name="color-scheme" content="light">
  <style>
    :root{--bar1:#f5699d;--bar2:#6dcff6;--ink:#24446f;--soft:#eff8ff;--line:#dbe8f3;--pink:#f5699d;--mint:#45c697;--yellow:#ffc83d;--paper:#ffffff;}
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;background:#e8f7ff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden;}
    #topbar{position:fixed;top:0;right:0;left:0;height:52px;display:flex;align-items:center;justify-content:center;padding:0 14px;background:linear-gradient(90deg,var(--bar1),var(--bar2));color:#fff;z-index:20;box-shadow:0 2px 10px rgba(36,68,111,.14);font-weight:800;font-size:16px;text-align:center;}
    #stage{position:fixed;top:52px;bottom:62px;right:0;left:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px;touch-action:pan-x pan-y pinch-zoom;background:radial-gradient(circle at 50% 25%,#fff 0%,#e8f7ff 60%,#dcf3fd 100%);}
    #spread{display:flex;gap:18px;align-items:flex-start;justify-content:center;}
    .pageWrap{width:min(92vw,460px);flex:0 0 auto;display:flex;flex-direction:column;gap:12px;}
    .pageWrap.desktop{width:min(42vw,460px);}
    .pageImgBox{background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(36,68,111,.16);overflow:hidden;}
    .pageImgBox img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
    .act{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:18px;padding:12px 12px 14px;box-shadow:0 8px 24px rgba(36,68,111,.08);}
    .act h3{margin:0 0 10px;font-size:15px;color:#24446f;display:flex;align-items:center;gap:8px;}
    .act h3 .dot{width:10px;height:10px;border-radius:50%;background:var(--pink);display:inline-block;}
    .act p.help{margin:0 0 10px;font-size:12px;line-height:1.7;color:#607ca3;}
    .act .grid{display:grid;gap:8px;}
    .act .grid.two{grid-template-columns:1fr 1fr;}
    .act .grid.three{grid-template-columns:repeat(3,1fr);}
    .act .grid.four{grid-template-columns:repeat(4,1fr);}
    .act label{display:block;font-size:12px;font-weight:700;color:#45658f;margin:0 0 4px;}
    .act input[type="text"], .act input[type="number"], .act textarea, .act select{width:100%;border:1px solid #cfe1ef;border-radius:12px;padding:10px 12px;background:#fbfeff;color:#24446f;font:inherit;font-size:13px;outline:none;}
    .act textarea{min-height:72px;resize:vertical;}
    .act input:focus,.act textarea:focus,.act select:focus{border-color:#7bcdf0;box-shadow:0 0 0 3px rgba(108,207,246,.14);}
    .chips{display:flex;flex-wrap:wrap;gap:6px;}
    .chip{border:1px solid #cfe1ef;background:#f6fbff;color:#24446f;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800;cursor:pointer;}
    .chip.on{background:#45c697;color:#fff;border-color:#45c697;}
    .chip.off{background:#f5699d;color:#fff;border-color:#f5699d;}
    .checklist{display:grid;gap:8px;}
    .rowline{display:grid;grid-template-columns:1fr auto auto auto auto auto;gap:6px;align-items:center;background:#f9fcff;border:1px solid #e6f1f9;border-radius:12px;padding:8px;}
    .rowline .ttl{font-size:12px;font-weight:700;color:#35557f;}
    .cb{appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid #8ed7b9;background:#fff;cursor:pointer;position:relative;}
    .cb:checked{background:#45c697;border-color:#45c697;}
    .cb:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900;}
    .days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px;}
    .days span{text-align:center;font-size:11px;color:#6987aa;font-weight:800;}
    .stars{display:flex;gap:4px;flex-wrap:wrap;}
    .starbtn{font-size:28px;line-height:1;border:0;background:transparent;cursor:pointer;color:#d9dee6;padding:0;}
    .starbtn.on{color:#ffc83d;}
    .sumBox{margin-top:8px;border:2px dashed #f3d279;background:#fffdf3;border-radius:14px;padding:10px 12px;font-weight:800;color:#7b6724;text-align:center;}
    .actionRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
    .actionRow button, #toolbar button{border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 1px 0 rgba(36,68,111,.08);}
    .actionRow button.primary, #toolbar button.nav{background:#f5699d;color:#fff;border:1px solid rgba(255,255,255,.75);}
    .small{font-size:11px;color:#6d88aa;}
    .result{margin-top:8px;font-size:12px;font-weight:800;color:#35557f;}
    .sudoku{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:220px;}
    .sudoku input{text-align:center;padding:8px 0;font-size:18px;font-weight:900;}
    .qtfRow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid #e6f1f9;border-radius:14px;padding:8px;background:#fbfdff;}
    .qtfRow .txt{font-size:12px;font-weight:700;color:#35557f;line-height:1.6;}
    .tiny{font-size:11px;}
    .hidden{display:none !important;}
    #toolbar{position:fixed;bottom:0;right:0;left:0;height:62px;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;z-index:20;box-shadow:0 -2px 10px rgba(36,68,111,.10);padding:8px;border-top:1px solid #eef5fb;}
    #pgind{min-width:104px;text-align:center;font-size:12px;font-weight:800;color:#52709a;}
    .emptyAct{display:none;}
    @media (max-width: 900px){
      #topbar{font-size:14px;height:48px;}
      #stage{top:48px;bottom:64px;padding:10px;}
      #spread{gap:0;}
      .pageWrap,.pageWrap.desktop{width:min(95vw,540px);}
      .act .grid.two,.act .grid.three,.act .grid.four{grid-template-columns:1fr;}
      .rowline{grid-template-columns:1fr repeat(5,22px);}
      #toolbar{gap:5px;padding:8px 6px;}
      #toolbar button{font-size:11px;padding:8px 10px;}
      #toolbar button.nav{padding:8px 14px;}
      #pgind{min-width:82px;font-size:11px;}
    }
    @media print{
      #topbar,#toolbar,.act{display:none !important;}
      html,body{overflow:visible;height:auto;background:#fff;}
      #stage{position:static;overflow:visible;display:block;padding:0;background:#fff;}
      #spread{display:block;}
      .pageWrap,.pageWrap.desktop{width:210mm !important;}
      .pageImgBox{box-shadow:none;border-radius:0;page-break-after:always;break-after:page;margin:0 auto;}
    }
  </style>
</head>
<body>
  <div id="topbar">مجلة الابتدائية الثانية برأس تنورة — نسخة إلكترونية تفاعلية</div>
  <div id="stage"><div id="spread"></div></div>
  <div id="toolbar">
    <button id="homeBtn">الرئيسية</button>
    <button id="prevBtn" class="nav">السابق</button>
    <span id="pgind">1 / 28</span>
    <button id="nextBtn" class="nav">التالي</button>
    <button id="fitBtn">أعلى الصفحة</button>
  </div>
<script>
const pages=[{src:'page_01.jpg', alt:'صفحة 1'},
  {src:'page_02.jpg', alt:'صفحة 2'},
  {src:'page_03.jpg', alt:'صفحة 3'},
  {src:'page_04.jpg', alt:'صفحة 4'},
  {src:'page_05.jpg', alt:'صفحة 5'},
  {src:'page_06.jpg', alt:'صفحة 6'},
  {src:'page_07.jpg', alt:'صفحة 7'},
  {src:'page_08.jpg', alt:'صفحة 8'},
  {src:'page_09.jpg', alt:'صفحة 9'},
  {src:'page_10.jpg', alt:'صفحة 10'},
  {src:'page_11.jpg', alt:'صفحة 11'},
  {src:'page_12.jpg', alt:'صفحة 12'},
  {src:'page_13.jpg', alt:'صفحة 13'},
  {src:'page_14.jpg', alt:'صفحة 14'},
  {src:'page_15.jpg', alt:'صفحة 15'},
  {src:'page_16.jpg', alt:'صفحة 16'},
  {src:'page_17.jpg', alt:'صفحة 17'},
  {src:'page_18.jpg', alt:'صفحة 18'},
  {src:'page_19.jpg', alt:'صفحة 19'},
  {src:'page_20.jpg', alt:'صفحة 20'},
  {src:'page_21.jpg', alt:'صفحة 21'},
  {src:'page_22.jpg', alt:'صفحة 22'},
  {src:'page_23.jpg', alt:'صفحة 23'},
  {src:'page_24.jpg', alt:'صفحة 24'},
  {src:'page_25.jpg', alt:'صفحة 25'},
  {src:'page_26.jpg', alt:'صفحة 26'},
  {src:'page_27.jpg', alt:'صفحة 27'},
  {src:'page_28.jpg', alt:'صفحة 28'}];
let index=0;
const spread=document.getElementById('spread');
const stage=document.getElementById('stage');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const homeBtn=document.getElementById('homeBtn');
const fitBtn=document.getElementById('fitBtn');
const pgind=document.getElementById('pgind');
const SKEY='magazine_interactive_v1';
let state={};
try{ state=JSON.parse(localStorage.getItem(SKEY)||'{}'); }catch(e){ state={}; }
const days=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء'];
function saveState(){ localStorage.setItem(SKEY, JSON.stringify(state)); }
function sv(k,v){ state[k]=v; saveState(); }
function gv(k,d=''){ return Object.prototype.hasOwnProperty.call(state,k)? state[k] : d; }
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function isMobile(){ return window.innerWidth <= 900; }
function pageWrapHtml(pageNo){
  const p=pages[pageNo-1];
  const desktopClass = isMobile()? '' : ' desktop';
  return `<div class="pageWrap${desktopClass}" data-page="${pageNo}">
    <div class="pageImgBox"><img loading="lazy" decoding="async" alt="${p.alt}" src="${p.src}"></div>
    ${interactivePanel(pageNo)}
  </div>`;
}
function getShownPages(){
  if(isMobile()) return [index+1];
  if(index===0) return [1];
  const p1 = index + 1;
  const p2 = p1 + 1 <= pages.length ? p1 + 1 : null;
  return p2 ? [p1,p2] : [p1];
}
function render(){
  stage.scrollTop=0; stage.scrollLeft=0;
  const shown=getShownPages();
  spread.innerHTML=shown.map(pageWrapHtml).join('');
  if(isMobile()){
    pgind.textContent=`${index+1} / ${pages.length}`;
    prevBtn.disabled=index<=0;
    nextBtn.disabled=index>=pages.length-1;
  } else {
    if(shown.length===1) pgind.textContent=`${shown[0]} / ${pages.length}`;
    else pgind.textContent=`${shown[0]}–${shown[1]} / ${pages.length}`;
    prevBtn.disabled=index<=0;
    nextBtn.disabled=shown[shown.length-1] >= pages.length;
  }
  bindDynamic();
}
function goPrev(){
  if(isMobile()){
    if(index>0) index--;
  } else {
    if(index===0) return;
    if(index===1) index=0; else index=Math.max(1,index-2);
  }
  render();
}
function goNext(){
  if(isMobile()){
    if(index<pages.length-1) index++;
  } else {
    if(index===0) index=1; else index=Math.min(pages.length-1,index+2);
  }
  render();
}
prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);
homeBtn.addEventListener('click', ()=>{ index=0; render(); });
fitBtn.addEventListener('click', ()=> stage.scrollTo({top:0,left:0,behavior:'smooth'}));
window.addEventListener('resize', render);
window.addEventListener('keydown', (e)=>{ if(e.key==='ArrowRight') goPrev(); if(e.key==='ArrowLeft') goNext(); });

function panelBox(title, help, body){
  return `<div class="act"><h3><span class="dot"></span>${title}</h3>${help?`<p class="help">${help}</p>`:''}${body}</div>`;
}
function clearPage(prefix){
  Object.keys(state).filter(k=>k.startsWith(prefix)).forEach(k=>delete state[k]);
  saveState(); render();
}
function truthRow(id, text){
  const v=gv(id,'');
  return `<div class="qtfRow"><div class="txt">${text}</div>
    <button type="button" class="chip ${v==='fact'?'on':''}" data-set="${id}" data-val="fact">حقيقة</button>
    <button type="button" class="chip ${v==='fiction'?'off':''}" data-set="${id}" data-val="fiction">خيال</button></div>`;
}
function inputField(id,label,ph=''){
  return `<div><label>${label}</label><input type="text" data-text="${id}" value="${esc(gv(id,''))}" placeholder="${ph}"></div>`;
}
function textAreaField(id,label,ph=''){
  return `<div><label>${label}</label><textarea data-text="${id}" placeholder="${ph}">${esc(gv(id,''))}</textarea></div>`;
}
function interactivePanel(pageNo){
  switch(pageNo){
    case 4: {
      const stars = Array.from({length:7}, (_,i)=>`<button type="button" class="starbtn ${(Number(gv('p4_stars',0))>i)?'on':''}" data-stars="p4_stars" data-count="${i+1}">★</button>`).join('');
      return panelBox('نشاط تفاعلي — تحدي الأذكار','اضغطي على النجوم لتسجيل أيام المواظبة.', `<div class="stars">${stars}</div><div class="sumBox">أيام الإنجاز: ${gv('p4_stars',0)} من 7</div><div class="actionRow"><button type="button" onclick="clearPage('p4_')">مسح</button></div>`);
    }
    case 8: {
      const items=[['صدقة ولو بريال',10],['أساعد محتاجًا أو زميلة',10],['أقول كلمة طيبة',5],['أقرأ وردي من القرآن',10],['أبر والدي وأطيعهما',10],['أحافظ على نظافة صفي',5]];
      let rows=''; let total=0;
      items.forEach((it,r)=>{
        let cbs='';
        for(let d=0; d<5; d++){
          const key=`p8_${r}_${d}`; const checked=!!gv(key,false); if(checked) total+=it[1];
          cbs += `<input class="cb" type="checkbox" data-bool="${key}" ${checked?'checked':''}>`;
        }
        rows += `<div class="rowline"><div class="ttl">${it[0]} <span class="small">(${it[1]} نقاط)</span></div>${cbs}</div>`;
      });
      return panelBox('نشاط تفاعلي — دفتر أخلاقي وتصرفاتي','علمي المربعات وسيُحسب مجموع النقاط تلقائيًا.', `<div class="days">${days.map(d=>`<span>${d}</span>`).join('')}</div><div class="checklist">${rows}</div><div class="sumBox">مجموع نقاطي هذا الأسبوع: ${total}</div><div class="actionRow"><button type="button" onclick="clearPage('p8_')">مسح الجدول</button></div>`);
    }
    case 9:
      return panelBox('نشاط تفاعلي — سحر الحروف','اكتبي الإجابات واحفظيها داخل الصفحة.', `<div class="grid two">${inputField('p9_x1','لطيفة الكلمة','مثال: حفيدتي')}${inputField('p9_x2','فعل أمر','مثال: اجتهدي')}${inputField('p9_x3','ثلاثة أسماء','مثال: الرسالة')}${inputField('p9_x4','أسلوب نداء','مثال: يا صغيرتي')}${inputField('p9_m1','معنى السراج','')}${inputField('p9_m2','معنى القِربة','')}${inputField('p9_m3','معنى التنور','')}</div>${textAreaField('p9_op','ما أجمل وصية في الرسالة برأيك؟','اكتبي رأيك هنا')}<div class="actionRow"><button type="button" onclick="clearPage('p9_')">مسح</button></div>`);
    case 10: {
      let riddles=''; for(let i=0;i<6;i++) riddles += inputField(`p10_r${i+1}`,`حل اللغز ${i+1}`);
      let proverbs=''; for(let i=0;i<4;i++) proverbs += inputField(`p10_p${i+1}`,`إكمال الحكمة ${i+1}`);
      return panelBox('نشاط تفاعلي — ألغاز وأمثال','اكتبي الحلول، ثم اضغطي تحقق.', `<div class="grid two">${riddles}${proverbs}</div><div class="actionRow"><button type="button" class="primary" data-check="p10">تحقق</button><button type="button" onclick="clearPage('p10_')">مسح</button></div><div class="result" id="res-p10">${esc(gv('res-p10',''))}</div>`);
    }
    case 12:
      return panelBox('نشاط تفاعلي — لغة الأرقام','يمكنك حل العمليات وكتابة الاستنتاج مباشرة.', `<div class="grid two">${inputField('p12_a1','نتيجة ١٧ + ٢٥')}${inputField('p12_a2','نتيجة ٦ × ٩')}${inputField('p12_a3','نتيجة ٥٨ − ١٠٠')}${inputField('p12_a4','نتيجة ٦ × ٧')}${inputField('p12_repeat','الرقم المتكرر')}${inputField('p12_thief','من أخذ الصندوق؟','مثال: القطة مشمش')}</div>${textAreaField('p12_match','كيف تشكلين مربعًا بثلاثة أعواد؟')}${textAreaField('p12_river','كيف تعبرين النهر بالجميع بأمان؟')}<div class="actionRow"><button type="button" onclick="clearPage('p12_')">مسح</button></div>`);
    case 13: {
      let sudoku='';
      const prefilled={1:'2',2:'3',3:'4',4:'1',10:'1',12:'3'};
      for(let i=1;i<=16;i++){
        if(prefilled[i]) sudoku += `<input value="${prefilled[i]}" readonly style="background:#eef7ff;border-color:#bcd7ef;">`;
        else sudoku += `<input type="number" min="1" max="4" data-text="p13_s${i}" value="${esc(gv(`p13_s${i}`,''))}">`;
      }
      return panelBox('نشاط تفاعلي — مهارات تفكير عليا','املئي السودوكو واكتبي الاستنتاجات.', `<label>سودوكو ٤×٤</label><div class="sudoku">${sudoku}</div><div class="grid two" style="margin-top:10px;">${inputField('p13_pat1','أكملي النمط ١')}${inputField('p13_pat2','أكملي النمط ٢')}${inputField('p13_pat3','أكملي النمط ٣')}${inputField('p13_logic','سارة تحب / ريم تحب / هند تحب')}${inputField('p13_odd','الرقم المختلف ولماذا؟')}</div><div class="actionRow"><button type="button" onclick="clearPage('p13_')">مسح</button></div>`);
    }
    case 15:
      return panelBox('نشاط تفاعلي — ما هو البلد الغامض؟','اكتبي إجابات التلميحات ثم اسم البلد.', `<div class="grid two">${inputField('p15_h1','أفقي ١: عاصمة البلد')}${inputField('p15_h3','أفقي ٣: منتج من الحليب')}${inputField('p15_h4','أفقي ٤: القارة')}${inputField('p15_h5','أفقي ٥: بلد الرسم والمتاحف')}${inputField('p15_v1','رأسي ١: بناء مرتفع من الحديد')}${inputField('p15_v2','رأسي ٢: نهر يمر بوسط العاصمة')}${inputField('p15_v4','رأسي ٤: اسم البرج الشهير')}${inputField('p15_country','البلد الغامض هو')}</div><div class="actionRow"><button type="button" class="primary" data-check="p15">تحقق</button><button type="button" onclick="clearPage('p15_')">مسح</button></div><div class="result" id="res-p15">${esc(gv('res-p15',''))}</div>`);
    case 19:
      return panelBox('نشاط تفاعلي — حقيقة أم خيال؟','اختاري حقيقة أو خيال لكل عبارة.', `${truthRow('p19_1','العسل الطبيعي لا يفسد حتى لو مرت عليه مئات السنين.')}${truthRow('p19_2','عندما ننظر إلى النجوم نرى ضوءًا انطلق منها قبل سنوات طويلة.')}${truthRow('p19_3','للأخطبوط ثلاثة قلوب ودمه أزرق اللون.')}${truthRow('p19_4','يمكن رؤية سور الصين العظيم من القمر بالعين المجردة.')}${truthRow('p19_5','الموز ينمو على أشجار ضخمة قوية الجذوع.')}${truthRow('p19_6','قلب الحوت الأزرق يقارب حجم سيارة صغيرة.')}${truthRow('p19_7','البرق أسخن من سطح الشمس.')}<div class="actionRow"><button type="button" class="primary" data-check="p19">تحقق</button><button type="button" onclick="clearPage('p19_')">مسح</button></div><div class="result" id="res-p19">${esc(gv('res-p19',''))}</div>`);
    case 20:
      return panelBox('ملاحظة تفاعلية — الصورة الخادعة','هذه الصفحة تعتمد على النظر للصورة نفسها. حرّكي عينيك بين المربعات السوداء وستلاحظين النقاط الوامضة. يمكنك تدوين ملاحظتك هنا.', `${textAreaField('p20_note','ماذا لاحظتِ؟','اكتبي ملاحظتك')}<div class="actionRow"><button type="button" onclick="clearPage('p20_')">مسح</button></div>`);
    case 21:
      return panelBox('نشاط تفاعلي — English Corner','اكتبي المطابقات واسمك بالإنجليزية.', `<div class="grid two">${inputField('p21_m1','Sun =')}${inputField('p21_m2','Flower =')}${inputField('p21_m3','Star =')}${inputField('p21_m4','Cat =')}${inputField('p21_name','Write your name in English')}</div><div class="actionRow"><button type="button" class="primary" data-check="p21">تحقق</button><button type="button" onclick="clearPage('p21_')">مسح</button></div><div class="result" id="res-p21">${esc(gv('res-p21',''))}</div>`);
    case 22:
      return panelBox('نشاط تفاعلي — نبض التقنية','اكتبي ثلاثة استخدامات مفيدة للجهاز اللوحي في دراستك.', `${textAreaField('p22_uses','إجابتي','مثال: البحث، حل الواجبات، مشاهدة شرح تعليمي')}<div class="actionRow"><button type="button" onclick="clearPage('p22_')">مسح</button></div>`);
    case 23:
      return panelBox('نشاط تفاعلي — نفتح باب الأمل','اكتبي هدفًا صغيرًا لهذا الأسبوع.', `${textAreaField('p23_goal','هدفي هذا الأسبوع','مثال: أقرأ 10 دقائق يوميًا')}<div class="actionRow"><button type="button" onclick="clearPage('p23_')">مسح</button></div>`);
    case 26:
      return panelBox('نشاط تفاعلي — مساحة أمان','اكتبي رسالة الشكر هنا أيضًا إن أحببتِ، مع بقاء الباركود داخل الصفحة الأصلية.', `${textAreaField('p26_msg','رسالة الشكر','شكرًا لكِ يا معلمتي...')}<div class="actionRow"><button type="button" onclick="clearPage('p26_')">مسح</button></div>`);
    case 28:
      return panelBox('نشاط إضافي — رأيك يهمنا','دوّني ملاحظاتك عن المجلة.', `${textAreaField('p28_feedback','رأيك في المجلة','أعجبني... وأقترح...')}<div class="actionRow"><button type="button" onclick="clearPage('p28_')">مسح</button></div>`);
    default:
      return '<div class="emptyAct"></div>';
  }
}
function bindDynamic(){
  document.querySelectorAll('[data-text]').forEach(el=>{
    el.addEventListener('input',()=>sv(el.getAttribute('data-text'), el.value));
  });
  document.querySelectorAll('[data-bool]').forEach(el=>{
    el.addEventListener('change',()=>{ sv(el.getAttribute('data-bool'), el.checked); render(); });
  });
  document.querySelectorAll('[data-stars]').forEach(el=>{
    el.addEventListener('click',()=>{ sv(el.getAttribute('data-stars'), Number(el.getAttribute('data-count'))); render(); });
  });
  document.querySelectorAll('[data-set]').forEach(el=>{
    el.addEventListener('click',()=>{ sv(el.getAttribute('data-set'), el.getAttribute('data-val')); render(); });
  });
  document.querySelectorAll('[data-check]').forEach(btn=>{
    btn.addEventListener('click',()=>checkAnswers(btn.getAttribute('data-check')));
  });
}
function norm(s){ return String(s||'').trim().replace(/\s+/g,' ').replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase(); }
function checkAnswers(type){
  let msg='';
  if(type==='p10'){
    const goodR=['المشط','القلم','الحفرة','الساعة','بيت الشعر','السحاب'];
    const goodP=['وجد','الشدائد','ودل','الحجر'];
    let c=0;
    goodR.forEach((a,i)=>{ if(norm(gv(`p10_r${i+1}`))===norm(a)) c++; });
    goodP.forEach((a,i)=>{ if(norm(gv(`p10_p${i+1}`))===norm(a)) c++; });
    msg = c===10 ? 'ممتاز! كل الإجابات صحيحة 🌟' : `أحسنتِ! لديك ${c} من 10 صحيحة.`;
    sv('res-p10',msg);
  }
  if(type==='p15'){
    const checks=[['p15_h1','باريس'],['p15_h3','جبن'],['p15_h4','اوروبا'],['p15_h5','فرنسا'],['p15_v1','برج'],['p15_v2','سين'],['p15_v4','ايفل'],['p15_country','فرنسا']];
    let c=0; checks.forEach(([k,a])=>{ if(norm(gv(k))===norm(a)) c++; });
    msg = c===checks.length ? 'رائع! البلد الغامض هو فرنسا 🇫🇷' : `لديك ${c} من ${checks.length} صحيحة. حاولي مرة أخرى.`;
    sv('res-p15',msg);
  }
  if(type==='p19'){
    const ans={p19_1:'fact',p19_2:'fact',p19_3:'fact',p19_4:'fiction',p19_5:'fiction',p19_6:'fact',p19_7:'fact'};
    let c=0; Object.keys(ans).forEach(k=>{ if(gv(k,'')===ans[k]) c++; });
    msg = c===7 ? 'ممتاز! إجاباتك كلها صحيحة 🌟' : `أحسنتِ! لديك ${c} من 7 صحيحة.`;
    sv('res-p19',msg);
  }
  if(type==='p21'){
    const ans={p21_m1:'شمس',p21_m2:'زهرة',p21_m3:'نجمة',p21_m4:'قطة'};
    let c=0; Object.keys(ans).forEach(k=>{ if(norm(gv(k))===norm(ans[k])) c++; });
    msg = c===4 ? 'رائع! المطابقات صحيحة.' : `لديك ${c} من 4 صحيحة.`;
    sv('res-p21',msg);
  }
  render();
}
render();
</script>
